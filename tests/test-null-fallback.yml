name: Test null fallback when no previous run found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}

      - name: Assert last_status is null or a valid conclusion when no prior run exists
        env:
          LAST_STATUS: ${{ steps.action.outputs.last_status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "last_status: $LAST_STATUS"
          VALID_CONCLUSIONS="success failure cancelled skipped timed_out action_required neutral stale null"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$LAST_STATUS" ]; then
              echo "FAIL: action succeeded but last_status is empty (expected 'null' or a conclusion)"
              exit 1
            fi
            # Verify it's one of the known valid values
            MATCHED=false
            for val in $VALID_CONCLUSIONS; do
              if [ "$LAST_STATUS" = "$val" ]; then
                MATCHED=true
                break
              fi
            done
            if [ "$MATCHED" = "true" ]; then
              echo "PASS: last_status='$LAST_STATUS' is a valid conclusion value"
            else
              echo "FAIL: last_status='$LAST_STATUS' is not a recognized conclusion value"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
